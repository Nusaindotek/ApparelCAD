<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApparelCAD - Industrial Pattern Visualizer</title>
    <link rel="stylesheet" href="./src/styles/app.css">
</head>
<body>
    <header>
        <div>
            <h1 style="margin:0;">ApparelCAD v1.0</h1>
            <p style="margin:4px 0 0 0; color:#64748b;">Visualisasi & Grading Pola Kaos Oblong Massal</p>
        </div>
        <div class="controls">
            <label for="sizeSelect"><strong>Pilih Ukuran (Grading):</strong></label>
            <select id="sizeSelect">
                <option value="S">Ukuran S</option>
                <option value="M" selected>Ukuran M</option>
                <option value="L">Ukuran L</option>
                <option value="XL">Ukuran XL</option>
            </select>
        </div>
    </header>

    <div id="apparel-canvas"></div>

    <script type="module" src="./src/app.js"></script>
</body>
</html>
