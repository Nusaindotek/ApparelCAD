<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortpants CAD & Marker Calculator</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
        .control-panel { background: #1e293b; padding: 16px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
        .input-group { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
        input[type="number"] { width: 90px; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #38bdf8; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Kalkulator Marker & Pola Shortpants Massal</h2>
    <p style="color: #94a3b8; font-size: 14px;">Optimasi Tata Letak Anti-Waste & Perhitungan Kain Presisi per Gelar</p>

    <div class="control-panel">
        <div class="input-group">
            <label for="fabricWidth">Masukkan Lebar Roll Kain Aktual (cm):</label>
            <input type="number" id="fabricWidth" value="80" min="50" max="150" />
        </div>
    </div>

    <div id="apparel-canvas"></div>

    <script type="module" src="./src/app.js"></script>
</body>
</html>
